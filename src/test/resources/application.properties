spring.application.name=notify

spring.mongodb.uri=mongodb://localhost:27017/solaria_notify_test?uuidRepresentation=standard
spring.mongodb.database=solaria_notify_test
spring.data.mongodb.auto-index-creation=false

spring.mongodb.representation.uuid=standard

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json

app.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json
app.jwt.issuer=solaria-auth

app.service-keys.api-messenger=test-messenger-key-0123456789abcdef0123
app.service-keys.api-core=test-core-key-0123456789abcdef0123456

management.tracing.enabled=false
management.logging.export.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.resource-attributes.deployment.environment=test
