# Pastas do Infisical que este repositório lê. Serve de documentação e de base
# para a checagem do .env.example; o Render não usa este arquivo.
folders:
  - /database
  - /auth
  - /fcm
  - /otel
  - /service-urls
# Variáveis do .env.example que não vêm do Infisical.
ignore: []
# Variáveis que só não existem em um ambiente.
ignore_by_env:
  local:
    - FCM_CREDENTIALS_BASE64
  qa:
    - OTEL_EXPORTER_OTLP_ENDPOINT
